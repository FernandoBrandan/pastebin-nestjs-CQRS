version: '3.8'

services: 
  app:
    build:
      context: ./pastebin-backend
    container_name: pastebin-app
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pastebin
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123

  postgres:
    image: postgres:14
    container_name: pastebin_postgres
    restart: always
    environment:
      POSTGRES_USER: pastebin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: pastebin_db
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pastebin_redis
    ports:
      - '6379:6379'

  minio:
    image: minio/minio
    container_name: pastebin_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
