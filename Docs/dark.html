<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Paste</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #0066cc;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0066cc;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0052a3;
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .paste-view {
            display: none;
        }

        .paste-content {
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            min-height: 300px;
        }

        .paste-info {
            background-color: #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .back-btn {
            background-color: #666;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background-color: #555;
        }

        .error {
            background-color: #aa3333;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            text-align: center;
        }

        .success {
            background-color: #33aa33;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Paste</h1>
        
        <!-- Create Paste Form -->
        <div id="create-form" class="create-view">
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" placeholder="Paste your code or text here..."></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="My Paste">
                </div>
                
                <div class="form-group">
                    <label for="expiration">Expiration</label>
                    <select id="expiration">
                        <option value="1h">1 Hour</option>
                        <option value="1d">1 Day</option>
                        <option value="1w" selected>1 Week</option>
                        <option value="1m">1 Month</option>
                        <option value="never">Never</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="visibility">Visibility</label>
                    <select id="visibility">
                        <option value="public" selected>Public</option>
                        <option value="unlisted">Unlisted</option>
                        <option value="private">Private</option>
                    </select>
                </div>
            </div>
            
            <div class="actions">
                <button onclick="createPaste()">Create Paste</button>
                <button onclick="loadPaste()" style="background-color: #666;">Load Paste</button>
            </div>
        </div>

        <!-- View Paste -->
        <div id="paste-view" class="paste-view">
            <button class="back-btn" onclick="showCreateForm()">← Back to Create</button>
            
            <div id="paste-info" class="paste-info">
                <div class="info-item">
                    <span>Title:</span>
                    <span id="view-title"></span>
                </div>
                <div class="info-item">
                    <span>Expiration:</span>
                    <span id="view-expiration"></span>
                </div>
                <div class="info-item">
                    <span>Visibility:</span>
                    <span id="view-visibility"></span>
                </div>
                <div class="info-item">
                    <span>Created:</span>
                    <span id="view-created"></span>
                </div>
            </div>
            
            <div id="paste-content" class="paste-content"></div>
        </div>

        <!-- Messages -->
        <div id="message"></div>
    </div>

    <script>
        // Sample data storage (in real app, this would be server-side)
        let pastes = {};
        let currentPasteId = null;

        function showMessage(text, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function formatExpiration(exp) {
            const map = {
                '1h': '1 Hour',
                '1d': '1 Day', 
                '1w': '1 Week',
                '1m': '1 Month',
                'never': 'Never'
            };
            return map[exp] || exp;
        }

        function formatVisibility(vis) {
            return vis.charAt(0).toUpperCase() + vis.slice(1);
        }

        async function createPaste() {
            const content = document.getElementById('content').value.trim();
            const title = document.getElementById('title').value.trim() || 'Untitled';
            const expiration = document.getElementById('expiration').value;
            const visibility = document.getElementById('visibility').value;

            if (!content) {
                showMessage('Content cannot be empty');
                return;
            }

            // Simulate POST request
            try {
                const pasteData = {
                    id: generateId(),
                    title,
                    content,
                    expiration,
                    visibility,
                    created: new Date().toISOString()
                };

                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Store paste (in real app, this would be sent to server)
                pastes[pasteData.id] = pasteData;
                
                showMessage(`Paste created successfully! ID: ${pasteData.id}`, 'success');
                
                // Clear form
                document.getElementById('content').value = '';
                document.getElementById('title').value = '';
                
                // Auto-load the created paste
                setTimeout(() => {
                    loadPasteById(pasteData.id);
                }, 1000);
                
            } catch (error) {
                showMessage('Failed to create paste. Please try again.');
            }
        }

        async function loadPaste() {
            const pasteId = prompt('Enter Paste ID:');
            if (!pasteId) return;
            
            await loadPasteById(pasteId);
        }

        async function loadPasteById(pasteId) {
            try {
                // Simulate GET request delay
                await new Promise(resolve => setTimeout(resolve, 300));
                
                // Get paste (in real app, this would be fetched from server)
                const paste = pastes[pasteId];
                
                if (!paste) {
                    showMessage('Paste not found');
                    return;
                }

                // Show paste view
                currentPasteId = pasteId;
                document.getElementById('view-title').textContent = paste.title;
                document.getElementById('view-expiration').textContent = formatExpiration(paste.expiration);
                document.getElementById('view-visibility').textContent = formatVisibility(paste.visibility);
                document.getElementById('view-created').textContent = new Date(paste.created).toLocaleString();
                document.getElementById('paste-content').textContent = paste.content;
                
                // Switch views
                document.getElementById('create-form').style.display = 'none';
                document.getElementById('paste-view').style.display = 'block';
                
            } catch (error) {
                showMessage('Failed to load paste. Please try again.');
            }
        }

        function showCreateForm() {
            document.getElementById('create-form').style.display = 'block';
            document.getElementById('paste-view').style.display = 'none';
            currentPasteId = null;
        }

        // Initialize with sample data
        pastes['abc123'] = {
            id: 'abc123',
            title: 'Sample Python Code',
            content: 'def hello():\n    print("Hello World!")\n\nhello()',
            expiration: '1w',
            visibility: 'public',
            created: new Date().toISOString()
        };
    </script>
</body>
</html>
